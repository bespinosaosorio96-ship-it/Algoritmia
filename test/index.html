<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FakeStore - Tienda Completa con Login</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    /* Estilos Modal Inline */
    .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:1000;align-items:center;justify-content:center}
    .modal.active{display:flex}
    .modal__content{background:#fff;padding:2rem;border-radius:12px;max-width:400px;width:90%;box-shadow:0 10px 30px rgba(0,0,0,0.3)}
    .form-group{margin-bottom:1rem}
    .form-group input{padding:0.75rem;border:1px solid #ddd;border-radius:6px;width:100%;box-sizing:border-box}
    .w-full{width:100%}
    .user-status{font-weight:bold;color:#007bff}
  </style>
</head>
<body>
  <header class="header">
    <div class="header__logo">
      <h1>FakeStore <span id="user-status" class="user-status"></span></h1>
    </div>
    <nav class="header__nav">
      <a href="history.html" class="btn btn--ghost">Historial</a>
      <button id="login-btn" class="btn btn--ghost">Login</button>
    </nav>
    <button class="header__cart-btn" type="button" aria-label="Carrito">
      <span class="header__cart-count">0</span>
    </button>
  </header>

  <main class="main">
    <!-- Filtros -->
    <section class="filters">
      <h2 class="visually-hidden">Filtros</h2>
      <div class="filters__search">
        <label for="search">Buscar</label>
        <input type="search" id="search" placeholder="Nombre o descripción">
      </div>
      <div class="filters__controls">
        <div class="filters__group">
          <label for="category">Categoría</label>
          <select id="category"><option value="all">Todas</option></select>
        </div>
        <div class="filters__group">
          <label for="sort">Ordenar</label>
          <select id="sort">
            <option value="default">Defecto</option>
            <option value="price-asc">Precio ↓</option>
            <option value="price-desc">Precio ↑</option>
          </select>
        </div>
      </div>
    </section>

    <!-- Layout Productos + Carrito -->
    <section class="layout">
      <section class="products" id="products">
        <h2 class="visually-hidden">Productos</h2>
      </section>

      <aside class="cart" id="cart">
        <div class="cart__head">
          <h2>Tu Carrito</h2>
          <span id="cart-count-label">0 artículos</span>
        </div>
        <div class="cart__items" id="cart-items"></div>

        <section class="cart__summary">
          <h3>Resumen</h3>
          <div class="cart__summary-row">
            <span>Subtotal</span><span id="cart-subtotal">$0.00</span>
          </div>
          <div class="cart__summary-row--muted">
            <span>Envío</span><span>Gratis</span>
          </div>
          <hr>
          <div class="cart__summary-total">
            <span>Total</span><strong id="cart-total">$0.00</strong>
          </div>

          <!-- Cupón -->
          <div class="cart__coupon">
            <input class="cart__coupon-input" type="text" placeholder="PROMO10 o PROMO20">
            <button class="btn cart__coupon-btn">Aplicar</button>
          </div>

          <form class="checkout" id="checkout-form">
            <h4>Pago (Simulación)</h4>
            <div class="checkout__group">
              <input type="text" id="checkout-name" placeholder="Nombre" required>
            </div>
            <div class="checkout__group">
              <input type="text" id="checkout-card" placeholder="XXXX XXXX XXXX XXXX" maxlength="19" required>
            </div>
            <div class="checkout__row">
              <input type="text" id="checkout-exp" placeholder="MM/AA" required>
              <input type="password" id="checkout-cvv" placeholder="CVV" maxlength="4" required>
            </div>
            <div class="checkout__group">
              <label>Método:</label>
              <label><input type="radio" name="payment-method" value="tarjeta" checked> Tarjeta</label>
              <label><input type="radio" name="payment-method" value="efectivo"> Efectivo</label>
            </div>
            <button type="submit" class="btn btn--primary">Pagar</button>
          </form>
        </section>
      </aside>
    </section>
  </main>

  <!-- MODAL LOGIN/REGISTER -->
  <div id="auth-modal" class="modal">
    <div class="modal__content">
      <h3 id="modal-title">Iniciar Sesión</h3>
      <form id="auth-form">
        <div class="form-group">
          <input type="email" id="user-email" placeholder="Email" required>
        </div>
        <div class="form-group">
          <input type="password" id="user-password" placeholder="Contraseña" required>
        </div>
        <button type="submit" class="btn btn--primary w-full">Entrar</button>
        <button type="button" id="toggle-auth" class="btn btn--ghost w-full">Crear Cuenta</button>
      </form>
    </div>
  </div>

  <!-- Scripts en orden correcto -->
  <script src="js/users.js"></script>
  <script src="js/api.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
